# --- HTTP ---
quarkus.http.port=8082

# --- Datasource: read-only merchant lookup against the same RLS-restricted
# app role used by the backend (resolve_merchant_by_api_key is SECURITY DEFINER). ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_APP_URL:jdbc:postgresql://localhost:5432/merchanthub}
quarkus.datasource.username=${DB_APP_USER:merchanthub_app}
quarkus.datasource.password=${DB_APP_PASSWORD:merchanthub_app_pw}
quarkus.datasource.jdbc.max-size=8

# --- Kafka ---
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.order-webhook-received.connector=smallrye-kafka
mp.messaging.outgoing.order-webhook-received.topic=order.webhook.received
mp.messaging.outgoing.order-webhook-received.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-webhook-received.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Shared HMAC secret with the shop / mock-shop-api ---
webhook.secret=${WEBHOOK_SECRET:dev-webhook-hmac-secret-change-me}

quarkus.native.additional-build-args=--initialize-at-build-time=org.postgresql

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/merchanthub_test
